# Weekly update proposals for the pinned Docker base image and CI actions.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project targets Python 3.12 (uv.lock, CI); only refresh the pinned
      # 3.12 digest, never jump to another Python version.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
