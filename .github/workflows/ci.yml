name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=json

      - name: Core coverage targets (tca, simulation, diagnostics >= 85%)
        run: uv run python scripts/check_coverage.py coverage.json

      # Small smoke benchmark on the committed sample: checks that the reference and
      # the Polars engine still agree and the harness runs. The full >1M-row benchmark
      # is run locally (execlens benchmark), not on every commit.
      - name: Smoke benchmark
        run: uv run execlens benchmark --smoke --no-api

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t execlens:ci .

      - name: CLI smoke test (analyse the bundled sample)
        run: docker run --rm execlens:ci execlens analyze --top 1

      - name: API smoke test
        run: |
          docker run -d --name api -p 8000:8000 execlens:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8000/api/v1/orders?limit=1"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/orders/NOPE)" = "404"
          docker rm -f api
